<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      /* the game fills the browser window exactly: no fixed canvas size, no scrollbars */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1620; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b1620; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #f4e9d8; font-family: Georgia, 'Times New Roman', serif; background: #0b1620; }
      #loading h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: 1px; font-weight: normal; }
      #loading h1 span { color: #f2c14e; }
      #loading p { opacity: .75; margin: 0; font-size: 20px; }
      #bar { width: min(420px, 60vw); height: 6px; background: rgba(255,255,255,.12); margin-top: 22px; border-radius: 3px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f2c14e; transition: width .2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>BAIT <span>&amp;</span> SWITCH</h1>
      <p>Calling the Deep&hellip;</p>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),   // crisp but light on high-DPI screens
      }, function (p) {
        document.querySelector("#fill").style.width = Math.round(p * 100) + "%";
      }).then(function () {
        document.querySelector("#loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
      // keep keyboard focus on the game after clicks
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
